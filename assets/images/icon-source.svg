<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">

  <!-- Full opaque background — fills edge to edge, zero transparent pixels -->
  <rect width="1024" height="1024" fill="#1A2332"/>

  <!--
    NO outer rings — they caused curved arc artifacts at squircle edges.

    PF letterforms — enlarged to fill the safe zone properly.
    Safe zone: inner 66% = x 174→850, y 174→850

    Bar thickness: 68px
    Letter height: 460px  (y: 230 → 690)
    Combined PF center: x=512

    P  x: 220 → 412  (192px wide)
    gap: 412 → 476   (64px)
    F  x: 476 → 700  (224px wide)
    center: (220+700)/2 = 460 — shift right 52px → P: 272→464, F: 528→752
    Recheck center: (272+752)/2 = 512 ✓
  -->

  <!-- ══ P ══ -->
  <!-- Left vertical bar -->
  <rect x="272" y="230" width="68" height="460" rx="18" fill="#FFFFFF"/>
  <!-- Top horizontal cap -->
  <rect x="340" y="230" width="124" height="68" rx="18" fill="#FFFFFF"/>
  <!-- Bowl right side (top half) -->
  <rect x="396" y="230" width="68" height="234" rx="18" fill="#FFFFFF"/>
  <!-- Middle cap (closes the bowl) -->
  <rect x="340" y="396" width="124" height="68" rx="18" fill="#FFFFFF"/>

  <!-- ══ F ══ -->
  <!-- Left vertical bar -->
  <rect x="528" y="230" width="68" height="460" rx="18" fill="#FFFFFF"/>
  <!-- Top horizontal bar -->
  <rect x="596" y="230" width="156" height="68" rx="18" fill="#FFFFFF"/>
  <!-- Middle horizontal bar (shorter) -->
  <rect x="596" y="396" width="120" height="68" rx="18" fill="#FFFFFF"/>

  <!-- Green connecting arc — "Connecting Talent" -->
  <path d="M 272,660 C 272,820 752,820 752,660"
        fill="none" stroke="#10B981" stroke-width="32"
        stroke-linecap="round"/>

  <!-- Arc endpoint dots -->
  <circle cx="272" cy="660" r="26" fill="#10B981"/>
  <circle cx="752" cy="660" r="26" fill="#10B981"/>

  <!-- Green diamond between P and F at top -->
  <rect x="484" y="200" width="52" height="52" rx="10"
        fill="#10B981" transform="rotate(45 510 226)"/>

</svg>
