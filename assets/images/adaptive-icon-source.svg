<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">

  <!--
    ANDROID ADAPTIVE ICON — foreground layer only.
    Background is TRANSPARENT — Android OS fills with backgroundColor="#1A2332"
    and clips to the device's shape (circle / squircle / square / etc.)

    Safe zone: inner 66% → x: 174–850, y: 174–850
    All elements are within safe zone ✓
  -->

  <!-- Subtle white ring (visible against the dark backgroundColor) -->
  <circle cx="512" cy="490" r="390" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.18"/>

  <!-- Green connecting arc -->
  <path d="M 268,628 C 268,798 756,798 756,628"
        fill="none" stroke="#10B981" stroke-width="28"
        stroke-linecap="round" opacity="0.95"/>

  <!-- Green node dots -->
  <circle cx="268" cy="628" r="22" fill="#10B981"/>
  <circle cx="756" cy="628" r="22" fill="#10B981"/>
  <circle cx="512" cy="766" r="14" fill="#10B981" opacity="0.6"/>

  <!-- P letterform -->
  <rect x="310" y="300" width="52" height="380" rx="14" fill="#FFFFFF"/>
  <rect x="362" y="300" width="96" height="52"  rx="14" fill="#FFFFFF"/>
  <rect x="406" y="300" width="52" height="196" rx="14" fill="#FFFFFF"/>
  <rect x="362" y="444" width="96" height="52"  rx="14" fill="#FFFFFF"/>

  <!-- F letterform -->
  <rect x="514" y="300" width="52" height="380" rx="14" fill="#FFFFFF"/>
  <rect x="566" y="300" width="148" height="52" rx="14" fill="#FFFFFF"/>
  <rect x="566" y="444" width="116" height="52" rx="14" fill="#FFFFFF"/>

  <!-- Green diamond accent -->
  <rect x="490" y="276" width="44" height="44" rx="8"
        fill="#10B981" transform="rotate(45 512 298)"/>

</svg>
