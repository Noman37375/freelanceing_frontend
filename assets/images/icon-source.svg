<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">

  <!-- Dark background (full square — iOS/Android apply their own masks) -->
  <rect width="1024" height="1024" fill="#1A2332"/>

  <!-- Subtle green accent ring -->
  <circle cx="512" cy="512" r="420" fill="none" stroke="#10B981" stroke-width="8" opacity="0.15"/>

  <!--
    PF letterforms — drawn as filled rectangles (no font dependency, renders
    identically on every server/OS via sharp/librsvg).

    Canvas: 1024×1024   Letter height: 400px
    Vertical center: y=512   So letters run y=312 → y=712

    Bar thickness: 52px

    P  occupies x: 347 → 487  (140px wide)
    Gap: 487 → 537  (50px)
    F  occupies x: 537 → 677  (140px wide)

    Combined group center: (347+677)/2 = 512  ✓
  -->

  <!-- ═══ P ═══ -->
  <!-- Left vertical bar -->
  <rect x="347" y="312" width="52" height="400" rx="12" fill="#FFFFFF"/>
  <!-- Top horizontal cap -->
  <rect x="399" y="312" width="88" height="52" rx="12" fill="#FFFFFF"/>
  <!-- P bowl – right vertical (top half only) -->
  <rect x="435" y="312" width="52" height="204" rx="12" fill="#FFFFFF"/>
  <!-- Middle horizontal cap (closes the bowl) -->
  <rect x="399" y="464" width="88" height="52" rx="12" fill="#FFFFFF"/>

  <!-- ═══ F ═══ -->
  <!-- Left vertical bar -->
  <rect x="537" y="312" width="52" height="400" rx="12" fill="#FFFFFF"/>
  <!-- Top horizontal bar (full width) -->
  <rect x="589" y="312" width="140" height="52" rx="12" fill="#FFFFFF"/>
  <!-- Middle horizontal bar (shorter) -->
  <rect x="589" y="476" width="110" height="52" rx="12" fill="#FFFFFF"/>

  <!-- Green accent dot (top-right of F) -->
  <circle cx="729" cy="312" r="26" fill="#10B981"/>

</svg>
