<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#1A2332"/>

  <!-- Green connecting arc -->
  <path d="M 18,64 C 18,82 82,82 82,64"
        fill="none" stroke="#10B981" stroke-width="5"
        stroke-linecap="round"/>

  <!-- Arc endpoint dots -->
  <circle cx="18" cy="64" r="4" fill="#10B981"/>
  <circle cx="82" cy="64" r="4" fill="#10B981"/>

  <!-- P -->
  <rect x="20" y="26" width="8"  height="36" rx="2" fill="#FFFFFF"/>
  <rect x="28" y="26" width="13" height="8"  rx="2" fill="#FFFFFF"/>
  <rect x="33" y="26" width="8"  height="19" rx="2" fill="#FFFFFF"/>
  <rect x="28" y="37" width="13" height="8"  rx="2" fill="#FFFFFF"/>

  <!-- F -->
  <rect x="51" y="26" width="8"  height="36" rx="2" fill="#FFFFFF"/>
  <rect x="59" y="26" width="21" height="8"  rx="2" fill="#FFFFFF"/>
  <rect x="59" y="37" width="17" height="8"  rx="2" fill="#FFFFFF"/>

  <!-- Diamond accent -->
  <rect x="43" y="21" width="8" height="8" rx="1.5"
        fill="#10B981" transform="rotate(45 47 25)"/>

</svg>
