<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">

  <!--
    Android Adaptive Icon — FOREGROUND LAYER
    Background is transparent; backgroundColor="#1A2332" is applied by the OS.

    Safe zone: inner 66% of 1024 = ~676px
    So logo must sit within x: 174→850, y: 174→850
    We center a slightly smaller PF (330px wide, 380px tall) at 512,512.

    Letters run y=322 → y=702  (380px tall, center=512 ✓)
    P  x: 347 → 487  (140px)
    Gap:   487 → 537  (50px)
    F  x: 537 → 677  (140px)
    Combined center: (347+677)/2 = 512 ✓
    All within safe zone (174→850) ✓
  -->

  <!-- ═══ P ═══ -->
  <rect x="347" y="322" width="52" height="380" rx="12" fill="#FFFFFF"/>
  <rect x="399" y="322" width="88" height="52"  rx="12" fill="#FFFFFF"/>
  <rect x="435" y="322" width="52" height="194" rx="12" fill="#FFFFFF"/>
  <rect x="399" y="464" width="88" height="52"  rx="12" fill="#FFFFFF"/>

  <!-- ═══ F ═══ -->
  <rect x="537" y="322" width="52" height="380" rx="12" fill="#FFFFFF"/>
  <rect x="589" y="322" width="140" height="52" rx="12" fill="#FFFFFF"/>
  <rect x="589" y="476" width="110" height="52" rx="12" fill="#FFFFFF"/>

  <!-- Green accent dot -->
  <circle cx="729" cy="322" r="26" fill="#10B981"/>

</svg>
